<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.PlanName}} - Version History</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: #ddd;
            --box-shadow: rgba(0,0,0,0.1);
            --accent-color: #000000;
            --danger-color: #dc3545;
            --success-color: #28a745;
        }

        body.dark-mode {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --border-color: #444444;
            --box-shadow: rgba(0,0,0,0.5);
            --accent-color: #ffffff;
            --danger-color: #ff6b6b;
            --success-color: #51cf66;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 4px var(--box-shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        h1 {
            color: var(--text-primary);
            font-size: 28px;
        }

        .back-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.7;
            text-decoration: underline;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 40px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 30px;
            margin-left: 120px;
            opacity: 0;
            animation: slideIn 0.4s ease forwards;
        }

        .timeline-item:nth-child(1) { animation-delay: 0.1s; }
        .timeline-item:nth-child(2) { animation-delay: 0.2s; }
        .timeline-item:nth-child(3) { animation-delay: 0.3s; }
        .timeline-item:nth-child(4) { animation-delay: 0.4s; }
        .timeline-item:nth-child(5) { animation-delay: 0.5s; }
        .timeline-item:nth-child(n+6) { animation-delay: 0.6s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .timeline-dot {
            position: absolute;
            left: -85px;
            top: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            border: 3px solid var(--bg-secondary);
            box-shadow: 0 0 0 2px var(--border-color);
        }

        .timeline-card {
            background: var(--bg-primary);
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 2px 4px var(--box-shadow);
            border-left: 3px solid var(--accent-color);
            transition: all 0.2s;
        }

        .timeline-card:hover {
            box-shadow: 0 4px 8px var(--box-shadow);
            transform: translateY(-2px);
        }

        .version-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .version-number {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 16px;
        }

        .version-date {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .version-info {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            gap: 15px;
        }

        .version-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .version-actions .btn {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-primary);
            border-radius: 8px;
            max-width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-primary);
            transition: opacity 0.2s;
        }

        .modal-close:hover {
            opacity: 0.6;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .modal-body {
            font-size: 14px;
            line-height: 1.6;
            max-height: 60vh;
            overflow-y: auto;
            word-wrap: break-word;
            white-space: pre-wrap;
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        /* Message */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 4px;
            z-index: 2000;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }

        .message.success {
            background: var(--success-color);
            color: white;
        }

        .message.error {
            background: var(--danger-color);
            color: white;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 10px;
        }

        /* Pagination */
        .pagination-controls {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .pagination-controls .btn {
            min-width: 120px;
        }

        /* Search */
        .search-section {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 4px var(--box-shadow);
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .search-results {
            margin-top: 20px;
        }

        .search-results-header {
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .search-result-item {
            padding: 12px;
            background: var(--bg-secondary);
            border-left: 3px solid var(--accent-color);
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-result-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .search-result-version {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 14px;
        }

        .search-result-date {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .search-result-preview {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            line-height: 1.4;
            font-style: italic;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
        }

        /* Settings Icon */
        .settings-icon {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
            transition: opacity 0.2s;
        }

        .settings-icon:hover {
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .timeline::before {
                left: 30px;
            }

            .timeline-item {
                margin-left: 80px;
            }

            .timeline-dot {
                left: -55px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .message {
                right: 10px;
                left: 10px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <a href="/" class="back-link">← Back to Plans</a>
                <h1>📜 {{.PlanName}} - Version History</h1>
            </div>
            <div class="header-actions">
            </div>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-form">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search across all versions..."
                    onkeypress="if(event.key==='Enter') performSearch()"
                >
                <button class="btn" onclick="performSearch()">Search</button>
                <button class="btn" onclick="clearSearch()" id="clearBtn" style="display: none;">Clear</button>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>

        <div id="versionsList" class="timeline">
            <!-- Versions loaded here -->
        </div>

        <div id="pagination" class="pagination-controls"></div>
    </div>

    <!-- Version View Modal -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeViewModal()">×</button>
            <div class="modal-header">
                <div class="modal-title" id="viewModalTitle"></div>
            </div>
            <div class="modal-body" id="viewModalContent"></div>
        </div>
    </div>

    <script>
        const planName = "{{.PlanName}}";
        let currentVersions = [];
        let nextPageToken = null;
        let hasMore = false;

        // Initialize
        function init() {
            loadVersionHistory();
            applyDarkModePref();
        }

        // Load version history
        async function loadVersionHistory() {
            try {
                const response = await fetch(`/api/plan/${planName}/versions`);
                if (!response.ok) throw new Error('Failed to load versions');

                const data = await response.json();
                currentVersions = data.versions || [];
                nextPageToken = data.nextToken;
                hasMore = data.hasMore;

                renderVersions(currentVersions);
                renderPaginationControls();
            } catch (error) {
                showMessage('error', 'Failed to load version history: ' + error.message);
            }
        }

        // Load more versions
        async function loadMoreVersions() {
            if (!nextPageToken) return;

            try {
                const response = await fetch(`/api/plan/${planName}/versions?pageToken=${nextPageToken}`);
                if (!response.ok) throw new Error('Failed to load more versions');

                const data = await response.json();
                currentVersions.push(...(data.versions || []));
                nextPageToken = data.nextToken;
                hasMore = data.hasMore;

                const timeline = document.getElementById('versionsList');
                data.versions.forEach(v => {
                    const item = createVersionElement(v);
                    timeline.appendChild(item);
                });

                renderPaginationControls();
                showMessage('success', 'Loaded more versions');
            } catch (error) {
                showMessage('error', 'Failed to load more versions: ' + error.message);
            }
        }

        // Render versions
        function renderVersions(versions) {
            const timeline = document.getElementById('versionsList');
            timeline.innerHTML = '';

            if (!versions || versions.length === 0) {
                timeline.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div class="empty-state-text">No versions yet</div>
                        <div style="font-size: 12px; color: var(--text-secondary);">
                            Versions are created when you update this plan
                        </div>
                    </div>
                `;
                return;
            }

            versions.forEach(version => {
                const item = createVersionElement(version);
                timeline.appendChild(item);
            });
        }

        // Create version element
        function createVersionElement(version) {
            const div = document.createElement('div');
            div.className = 'timeline-item';
            div.innerHTML = `
                <div class="timeline-dot"></div>
                <div class="timeline-card">
                    <div class="version-header">
                        <span class="version-number">Version ${version.versionNumber}</span>
                        <span class="version-date">${new Date(version.createdAt).toLocaleString()}</span>
                    </div>
                    <div class="version-info">
                        <span>📝 ${version.wordCount} words</span>
                    </div>
                    <div class="version-actions">
                        <button class="btn" onclick="viewVersion(${version.versionNumber})">View</button>
                        <button class="btn" onclick="restoreVersion(${version.versionNumber})">Restore</button>
                    </div>
                </div>
            `;
            return div;
        }

        // View version
        async function viewVersion(versionNumber) {
            try {
                const response = await fetch(`/api/plan/${planName}/versions/${versionNumber}`);
                if (!response.ok) throw new Error('Failed to load version');

                const data = await response.json();
                const modal = document.getElementById('viewModal');
                document.getElementById('viewModalTitle').textContent = `Version ${data.versionNumber} - ${new Date(data.createdAt).toLocaleString()}`;
                document.getElementById('viewModalContent').textContent = data.content;
                modal.classList.add('active');
            } catch (error) {
                showMessage('error', 'Failed to load version: ' + error.message);
            }
        }

        // Close view modal
        function closeViewModal() {
            document.getElementById('viewModal').classList.remove('active');
        }

        // Restore version
        async function restoreVersion(versionNumber) {
            if (!confirm(`Restore version ${versionNumber}? This will create a new version with the restored content.`)) {
                return;
            }

            try {
                const response = await fetch(`/api/plan/${planName}/restore/${versionNumber}`, { method: 'POST' });
                if (!response.ok) throw new Error('Failed to restore version');

                showMessage('success', `Version ${versionNumber} restored successfully!`);
                setTimeout(() => loadVersionHistory(), 1000);
            } catch (error) {
                showMessage('error', 'Failed to restore version: ' + error.message);
            }
        }

        // Render pagination controls
        function renderPaginationControls() {
            const container = document.getElementById('pagination');
            if (!hasMore) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <button class="btn" onclick="loadMoreVersions()">Load More Versions</button>
            `;
        }

        // Show message
        function showMessage(type, text) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            document.body.appendChild(msg);

            setTimeout(() => {
                msg.remove();
            }, 4000);
        }

        // Dark mode
        function applyDarkModePref() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) document.body.classList.add('dark-mode');
        }

        // Close modal on outside click
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('viewModal');
            if (e.target === modal) modal.classList.remove('active');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('viewModal').classList.remove('active');
            }
        });

        // Search functionality
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                showMessage('error', 'Please enter a search term');
                return;
            }

            try {
                const response = await fetch(`/api/plan/${planName}/versions/search?q=${encodeURIComponent(query)}`);
                if (!response.ok) throw new Error('Search failed');

                const data = await response.json();
                displaySearchResults(data, query);
                document.getElementById('clearBtn').style.display = 'inline-block';
            } catch (error) {
                showMessage('error', 'Search failed: ' + error.message);
            }
        }

        function displaySearchResults(data, query) {
            const resultsDiv = document.getElementById('searchResults');
            
            if (!data.results || data.results.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">No versions found matching "' + escapeHtml(query) + '"</div>';
                document.getElementById('versionsList').innerHTML = '';
                return;
            }

            let html = `<div class="search-results-header">Found in ${data.resultsCount} version(s)</div>`;
            
            data.results.forEach(result => {
                const preview = result.preview.length > 150 ? result.preview.substring(0, 150) + '...' : result.preview;
                html += `
                    <div class="search-result-item" onclick="viewVersion(${result.versionNumber})">
                        <div class="search-result-version">Version ${result.versionNumber}</div>
                        <div class="search-result-date">${new Date(result.createdAt).toLocaleString()}</div>
                        <div class="search-result-preview">"${escapeHtml(preview)}"</div>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
            document.getElementById('versionsList').innerHTML = '';
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('clearBtn').style.display = 'none';
            loadVersionHistory();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Start
        init();
    </script>
</body>
</html>
