<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.PlanDetail.Title}} - Claude Plan Viewer</title>

    <!-- EasyMDE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">

    <style>
        /* Dark mode theme for EasyMDE */
        body.dark-mode .CodeMirror {
            background: var(--bg-secondary) !important;
            color: var(--text-primary) !important;
        }
        body.dark-mode .CodeMirror-gutters {
            background: var(--bg-secondary) !important;
            border-color: var(--border-color) !important;
        }
        body.dark-mode .CodeMirror-linenumber {
            color: var(--text-secondary) !important;
        }
        body.dark-mode .CodeMirror-cursor {
            border-left-color: var(--text-primary) !important;
        }
        body.dark-mode .editor-toolbar {
            background: var(--bg-secondary) !important;
            border-color: var(--border-color) !important;
        }
        body.dark-mode .editor-toolbar button {
            color: var(--text-primary) !important;
        }
        body.dark-mode .editor-toolbar button:hover {
            background: var(--bg-primary) !important;
        }
        body.dark-mode .editor-preview,
        body.dark-mode .editor-preview-side {
            background: var(--bg-secondary) !important;
            color: var(--text-primary) !important;
        }
        body.dark-mode .editor-statusbar {
            background: var(--bg-secondary) !important;
            border-color: var(--border-color) !important;
            color: var(--text-primary) !important;
        }
    </style>

    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: #ddd;
            --box-shadow: rgba(0,0,0,0.1);
            --input-border: #ddd;
            --input-focus-border: #000;
        }

        body.dark-mode {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --border-color: #444444;
            --box-shadow: rgba(0,0,0,0.5);
            --input-border: #555555;
            --input-focus-border: #888888;
        }

        body {
            font-family: Georgia, serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }
        header {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 4px var(--box-shadow);
            transition: background-color 0.3s;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .plan-info {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 5px;
            transition: color 0.3s;
        }
        h1 { margin: 0; color: var(--text-primary); transition: color 0.3s; }
        .back-link {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .back-link:hover { text-decoration: underline; }
        .action-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .settings-icon {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            line-height: 1;
        }
        .settings-icon:hover {
            opacity: 0.7;
        }
        .btn {
            padding: 8px 16px;
            border: 2px solid var(--text-primary);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-primary { 
            background: var(--text-primary);
            color: var(--bg-primary);
        }
        .btn-primary:hover:not(:disabled) {
            opacity: 0.8;
        }
        .btn-secondary { 
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-secondary);
        }
        .btn-success { 
            background: var(--text-primary);
            color: var(--bg-primary);
        }
        .btn-success:hover:not(:disabled) {
            opacity: 0.8;
        }
        main {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--box-shadow);
            transition: background-color 0.3s;
        }
        #editor-container {
            display: none;
        }
        #view-container {
            display: block;
        }
        .markdown-content {
            line-height: 1.6;
            color: var(--text-primary);
            transition: color 0.3s;
        }
        .markdown-content h1, .markdown-content h2 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 24px;
            transition: border-color 0.3s;
        }
        .markdown-content h1 { font-size: 2em; }
        .markdown-content h2 { font-size: 1.5em; }
        .markdown-content h3 { font-size: 1.25em; }
        .markdown-content pre {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            transition: background-color 0.3s;
        }
        .markdown-content code {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
            transition: background-color 0.3s;
        }
        .markdown-content pre code {
            background: none;
            padding: 0;
        }
        .markdown-content ul, .markdown-content ol {
            margin: 16px 0;
            padding-left: 2em;
        }
        .markdown-content li {
            margin: 8px 0;
        }
        .markdown-content blockquote {
            border-left: 4px solid var(--border-color);
            padding-left: 16px;
            margin: 16px 0;
            color: var(--text-secondary);
            transition: border-color 0.3s, color 0.3s;
        }
        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }
        .markdown-content th, .markdown-content td {
            border: 1px solid var(--text-primary);
            padding: 8px;
            text-align: left;
            transition: border-color 0.3s;
        }
        .markdown-content th {
            background: var(--bg-secondary);
            font-weight: 600;
            border: 2px solid var(--text-primary);
        }
        .conflict-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .conflict-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-primary);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--box-shadow);
            max-width: 500px;
            width: 90%;
            z-index: 1000;
            display: none;
            color: var(--text-primary);
        }
        .conflict-dialog h3 {
            margin-top: 0;
            color: var(--text-primary);
        }
        .conflict-dialog-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        /* Settings Panel Styles */
        .settings-icon {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            line-height: 1;
        }
        .settings-icon:hover {
            opacity: 0.7;
        }
        .settings-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        .settings-backdrop.active {
            display: block;
        }
        .settings-panel {
            position: fixed;
            top: 0;
            left: -350px;
            width: 350px;
            height: 100%;
            background: var(--bg-primary);
            box-shadow: 2px 0 10px var(--box-shadow);
            z-index: 1000;
            transition: left 0.3s ease-out;
            overflow-y: auto;
        }
        .settings-panel.active {
            left: 0;
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .settings-header h2 {
            margin: 0;
            font-size: 20px;
            color: var(--text-primary);
        }
        .settings-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            color: var(--text-primary);
        }
        .settings-close:hover {
            opacity: 0.7;
        }
        .settings-content {
            padding: 20px;
        }
        .setting-group {
            margin-bottom: 25px;
        }
        .setting-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }
        .setting-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.2s;
        }
        .setting-input:focus {
            outline: none;
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
        }
        .setting-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        .setting-default {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 3px;
        }
        .settings-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .settings-button {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .settings-button.save {
            background: var(--text-primary);
            color: var(--bg-primary);
        }
        .settings-button.save:hover:not(:disabled) {
            opacity: 0.8;
        }
        .settings-button.save:disabled {
            background: #ccc;
            cursor: not-allowed;
            color: #666;
        }
        .settings-button.cancel {
            background: var(--border-color);
            color: var(--text-primary);
        }
        .settings-button.cancel:hover {
            background: var(--text-secondary);
        }
        .settings-message {
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        .settings-message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .settings-message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Dark Mode Toggle Switch */
        .toggle-switch {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .toggle-switch input {
            display: none;
        }

        .toggle-slider {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
            background-color: var(--border-color);
            border-radius: 24px;
            transition: background-color 0.3s;
            margin-right: 10px;
        }

        .toggle-slider:after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            left: 2px;
            top: 2px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: var(--text-primary);
        }

        .toggle-switch input:checked + .toggle-slider:after {
            transform: translateX(26px);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-controls">
            <div class="header-left">
                <a href="/" class="back-link">&larr; Back to list</a>
                <h1>{{.PlanDetail.Title}}</h1>
                <div class="plan-info">{{.PlanDetail.ReadingTime}} min read</div>
            </div>
            <div class="action-buttons">
                <button class="settings-icon" id="settingsButton" title="Settings">⚙️</button>
                <button onclick="location.href='/plan/{{.PlanDetail.FileName}}/versions'" class="btn btn-secondary" title="View Version History">📜 History</button>
                <button id="syncOnlyBtn" class="btn btn-secondary" onclick="syncOnlyChanges()" title="Sync changes to Claude code directory">
                    Sync
                </button>
                <button id="editBtn" class="btn btn-primary" onclick="enterEditMode()">
                    Edit
                </button>
                <button id="cancelBtn" class="btn btn-secondary" onclick="cancelEdit()" style="display:none;">
                    Cancel
                </button>
                <button id="saveBtn" class="btn btn-primary" onclick="saveChanges()" style="display:none;">
                    Save & Sync
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- View Mode -->
        <div id="view-container" class="markdown-content">
            {{.RenderedHTML}}
        </div>

        <!-- Edit Mode -->
        <div id="editor-container">
            <textarea id="markdown-editor">{{.PlanDetail.Content}}</textarea>
        </div>
    </main>

    <!-- Conflict Dialog -->
    <div class="conflict-overlay" id="conflictOverlay" onclick="closeConflictDialog()"></div>
    <div class="conflict-dialog" id="conflictDialog">
        <h3>Conflict Detected</h3>
        <p id="conflictMessage"></p>
        <div class="conflict-dialog-buttons">
            <button class="btn btn-primary" onclick="closeConflictDialog(); saveChanges(true);">Overwrite Anyway</button>
            <button class="btn btn-secondary" onclick="closeConflictDialog()">Cancel</button>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-backdrop" id="settingsBackdrop"></div>
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h2>Settings</h2>
            <button class="settings-close" id="settingsCloseBtn">×</button>
        </div>
        <div class="settings-content">
            <div class="setting-group">
                <label class="setting-label">Reading Speed (WPM)</label>
                <input 
                    type="number" 
                    id="readingSpeedInput" 
                    class="setting-input" 
                    min="1" 
                    max="1000"
                    placeholder="Enter words per minute"
                >
                <div class="setting-default" id="readingSpeedDefault">Default: 200 WPM</div>
                <div class="setting-hint">Higher values = faster reading speed = shorter reading time</div>
            </div>

            <div class="setting-group">
                <label class="setting-label">Dark Mode</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="settings-buttons">
                <button class="settings-button save" id="saveButton" disabled>Save</button>
                <button class="settings-button cancel" id="cancelButton">Cancel</button>
            </div>

            <div class="settings-message" id="settingsMessage"></div>
        </div>
    </div>

    <!-- EasyMDE JS -->
    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>

    <script>
        let easyMDE = null;
        let isEditMode = false;
        const fileName = "{{.PlanDetail.FileName}}";
        const lastModifiedTime = new Date("{{.PlanDetail.ModifiedAt}}");

        function enterEditMode() {
            isEditMode = true;
            document.getElementById('view-container').style.display = 'none';
            document.getElementById('editor-container').style.display = 'block';
            document.getElementById('editBtn').style.display = 'none';
            document.getElementById('syncOnlyBtn').style.display = 'none';
            document.getElementById('cancelBtn').style.display = 'inline-block';
            document.getElementById('saveBtn').style.display = 'inline-block';

            // Initialize EasyMDE if not already initialized
            if (!easyMDE) {
                easyMDE = new EasyMDE({
                    element: document.getElementById('markdown-editor'),
                    spellChecker: false,
                    toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "code", "|", "preview", "side-by-side", "fullscreen", "|", "guide"],
                    minHeight: "500px",
                });
            }
        }

        function cancelEdit() {
            isEditMode = false;
            document.getElementById('view-container').style.display = 'block';
            document.getElementById('editor-container').style.display = 'none';
            document.getElementById('editBtn').style.display = 'inline-block';
            document.getElementById('syncOnlyBtn').style.display = 'inline-block';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('saveBtn').style.display = 'none';
        }

        async function syncOnlyChanges() {
            const syncBtn = document.getElementById('syncOnlyBtn');
            const originalText = syncBtn.textContent;

            syncBtn.disabled = true;
            syncBtn.textContent = 'Syncing...';

            try {
                const response = await fetch(`/plan/${fileName}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        fileName: fileName,
                        content: document.getElementById('view-container').textContent,
                        lastModifiedTime: lastModifiedTime.toISOString(),
                        force: false,
                    }),
                });

                const data = await response.json();

                if (response.status === 409 && data.hasConflict) {
                    alert('Cannot sync: File was modified externally');
                } else if (data.success) {
                    alert('Synced successfully');
                } else {
                    alert(`Error: ${data.error || 'Failed to sync'}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                syncBtn.disabled = false;
                syncBtn.textContent = originalText;
            }
        }

        async function saveChanges(force = false) {
            const content = easyMDE.value();
            const saveBtn = document.getElementById('saveBtn');
            const originalText = saveBtn.textContent;

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving & Syncing...';

            try {
                const response = await fetch(`/plan/${fileName}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        fileName: fileName,
                        content: content,
                        lastModifiedTime: lastModifiedTime.toISOString(),
                        force: force,
                    }),
                });

                const data = await response.json();

                if (response.status === 409 && data.hasConflict) {
                    showConflictDialog(data.conflict.message);
                } else if (data.success) {
                    window.location.reload();
                } else {
                    alert(`Error: ${data.error || 'Failed to save and sync changes'}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = originalText;
            }
        }

        function showConflictDialog(message) {
            document.getElementById('conflictMessage').textContent = message;
            document.getElementById('conflictOverlay').style.display = 'block';
            document.getElementById('conflictDialog').style.display = 'block';
        }

        function closeConflictDialog() {
            document.getElementById('conflictOverlay').style.display = 'none';
            document.getElementById('conflictDialog').style.display = 'none';
        }

        // Settings Panel Logic
        const settingsButton = document.getElementById('settingsButton');
        const settingsBackdrop = document.getElementById('settingsBackdrop');
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsCloseBtn = document.getElementById('settingsCloseBtn');
        const cancelButton = document.getElementById('cancelButton');
        const saveButton = document.getElementById('saveButton');
        const readingSpeedInput = document.getElementById('readingSpeedInput');
        const darkModeToggle = document.getElementById('darkModeToggle');
        const settingsMessage = document.getElementById('settingsMessage');

        let originalReadingSpeedValue = null;
        let originalDarkModeValue = null;

        // Initialize dark mode from database
        function initializeDarkMode() {
            fetch('/api/setting/dark_mode_enabled')
                .then(response => response.json())
                .then(data => {
                    const isDarkMode = data.values.booleanValue || false;
                    applyDarkMode(isDarkMode);
                    darkModeToggle.checked = isDarkMode;
                    originalDarkModeValue = isDarkMode;
                })
                .catch(err => console.error('Failed to load dark mode setting:', err));
        }

        // Apply dark mode
        function applyDarkMode(isDarkMode) {
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        // Open settings panel
        settingsButton.addEventListener('click', () => {
            settingsBackdrop.classList.add('active');
            settingsPanel.classList.add('active');
            loadSettings();
        });

        // Close settings panel
        function closeSettings() {
            settingsBackdrop.classList.remove('active');
            settingsPanel.classList.remove('active');
            settingsMessage.classList.remove('success', 'error');
            settingsMessage.textContent = '';
        }

        settingsCloseBtn.addEventListener('click', closeSettings);
        cancelButton.addEventListener('click', closeSettings);
        settingsBackdrop.addEventListener('click', closeSettings);

        // Prevent closing when clicking inside panel
        settingsPanel.addEventListener('click', (e) => e.stopPropagation());

        // Load current settings
        async function loadSettings() {
            try {
                const response = await fetch('/api/setting/reading_speed_wpm');
                const data = await response.json();
                
                if (data.values.numberValue) {
                    readingSpeedInput.value = data.values.numberValue;
                    originalReadingSpeedValue = data.values.numberValue;
                } else {
                    readingSpeedInput.value = '';
                    originalReadingSpeedValue = null;
                }
                
                updateSaveButtonState();
            } catch (error) {
                console.error('Failed to load settings:', error);
                showMessage('error', 'Failed to load settings');
            }
        }

        // Track input changes for reading speed
        readingSpeedInput.addEventListener('input', updateSaveButtonState);

        // Handle dark mode toggle
        darkModeToggle.addEventListener('change', async () => {
            const isDarkMode = darkModeToggle.checked;
            applyDarkMode(isDarkMode);

            try {
                const response = await fetch('/api/setting/dark_mode_enabled', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        booleanValue: isDarkMode
                    })
                });

                const data = await response.json();

                if (data.success) {
                    originalDarkModeValue = isDarkMode;
                    showMessage('success', 'Dark mode ' + (isDarkMode ? 'enabled' : 'disabled'));
                } else {
                    // Revert if failed
                    applyDarkMode(originalDarkModeValue);
                    darkModeToggle.checked = originalDarkModeValue;
                    showMessage('error', data.error || 'Failed to update dark mode');
                }
            } catch (error) {
                // Revert if error
                applyDarkMode(originalDarkModeValue);
                darkModeToggle.checked = originalDarkModeValue;
                showMessage('error', 'Error updating dark mode: ' + error.message);
            }
        });

        function updateSaveButtonState() {
            const currentValue = readingSpeedInput.value || null;
            const hasChanged = String(currentValue) !== String(originalReadingSpeedValue);
            saveButton.disabled = !hasChanged;
        }

        // Save reading speed settings
        saveButton.addEventListener('click', async () => {
            const wpm = parseFloat(readingSpeedInput.value);
            
            if (isNaN(wpm) || wpm <= 0) {
                showMessage('error', 'Please enter a valid number greater than 0');
                return;
            }

            saveButton.disabled = true;
            
            try {
                const response = await fetch('/api/setting/reading_speed_wpm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        numberValue: wpm
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('success', 'Settings saved successfully');
                    originalReadingSpeedValue = wpm;
                    saveButton.disabled = true;
                    
                    // Reload page after 1 second to reflect changes
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    showMessage('error', data.error || 'Failed to save settings');
                    saveButton.disabled = false;
                }
            } catch (error) {
                showMessage('error', 'Error saving settings: ' + error.message);
                saveButton.disabled = false;
            }
        });

        function showMessage(type, text) {
            settingsMessage.classList.remove('success', 'error');
            settingsMessage.classList.add(type);
            settingsMessage.textContent = text;
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializeDarkMode);
    </script>
</body>
</html>
