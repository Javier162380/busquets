version: "2"
sql:
  - engine: "sqlite"
    queries: "services/claude-viewer/sqlc/queries.sql"
    schema: "services/claude-viewer/sqlc/schema.sql"
    gen:
      go:
        package: "repository"
        out: "services/claude-viewer/repository"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
