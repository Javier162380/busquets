version: "2"
sql:
  # SQLite backend
  - engine: "sqlite"
    queries: "services/busquets/sqlc/sqlite/queries.sql"
    schema: "services/busquets/sqlc/sqlite/schema.sql"
    gen:
      go:
        package: "sqlite"
        out: "services/busquets/repository/sqlite"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: false
        emit_empty_slices: true

  # PostgreSQL backend
  - engine: "postgresql"
    queries: "services/busquets/sqlc/postgres/queries.sql"
    schema: "services/busquets/sqlc/postgres/schema.sql"
    gen:
      go:
        package: "postgres"
        out: "services/busquets/repository/postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: false
        emit_empty_slices: true
